<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>CNG Vinted déménage</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; background: #090b0a; color: #f5f5f4; font: 16px/1.5 -apple-system, system-ui, sans-serif; }
  main { max-width: 460px; margin: 0 auto; padding: 48px 20px; text-align: center; }
  h1 { font-size: 24px; margin: 0 0 8px; }
  p { color: #a8a29e; margin: 0 0 16px; }
  a.btn, button { display: block; width: 100%; box-sizing: border-box; padding: 14px; border-radius: 14px; border: 0; font: inherit; font-weight: 700; margin-top: 10px; text-decoration: none; }
  .primary { background: #5ef07c; color: #062b10; }
  .ghost { background: #1c1f1d; color: #f5f5f4; }
  .spin { width: 28px; height: 28px; margin: 0 auto 18px; border: 3px solid #1f3a26; border-top-color: #5ef07c; border-radius: 50%; animation: s 0.8s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<main>
  <div class="spin" id="spin"></div>
  <h1>CNG Vinted déménage</h1>
  <p id="msg">Nouvelle adresse : <b>cngapp.github.io</b>. Tes données sont transférées automatiquement…</p>
  <div id="actions"></div>
</main>
<script>
/*
 * Ancienne adresse de l'appli : transfère les données de cet appareil vers la nouvelle adresse,
 * puis y redirige. Les données restent aussi ici (rien n'est effacé).
 */
(function () {
  var beta = location.pathname.indexOf('/beta/') >= 0;
  var DB = beta ? 'cng-vinted-beta' : 'vinted-profit-ai';
  var TARGET = 'https://cngapp.github.io/' + (beta ? 'beta/' : '');
  // essais en local uniquement : autre adresse de destination
  var cible = new URLSearchParams(location.search).get('cible');
  if (location.hostname === 'localhost' && cible) TARGET = cible;
  var MAX = 1800000; // taille maximale transmise dans l'adresse
  var msg = document.getElementById('msg');
  var actions = document.getElementById('actions');

  // l'ancienne version de l'appli (mise en cache) ne doit plus s'ouvrir ici
  try { navigator.serviceWorker && navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); }); } catch (e) {}
  try { window.caches && caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); }); } catch (e) {}

  function go(extra) { location.replace(TARGET + (extra || '')); }
  var again = /[?&]transfert/.test(location.search);
  var done = false;
  try { done = localStorage.getItem('cng-transfert-fait') === '1'; } catch (e) {}
  if (done && !again) return go();

  function readAll() {
    return new Promise(function (resolve) {
      var created = false;
      var req;
      try { req = indexedDB.open(DB); } catch (e) { return resolve(null); }
      req.onupgradeneeded = function () { created = true; };
      req.onerror = function () { resolve(null); };
      req.onsuccess = function () {
        var db = req.result;
        if (created || !db.objectStoreNames.length) { db.close(); if (created) indexedDB.deleteDatabase(DB); return resolve(null); }
        var names = Array.prototype.slice.call(db.objectStoreNames);
        var tx = db.transaction(names, 'readonly');
        var out = {};
        names.forEach(function (n) { var g = tx.objectStore(n).getAll(); g.onsuccess = function () { out[n] = g.result; }; });
        tx.oncomplete = function () { db.close(); resolve(out); };
        tx.onerror = function () { db.close(); resolve(null); };
      };
    });
  }

  function blobToDataURL(b) {
    return new Promise(function (res) { var r = new FileReader(); r.onload = function () { res(r.result); }; r.onerror = function () { res(null); }; r.readAsDataURL(b); });
  }

  function b64url(bytes) {
    var bin = '';
    for (var i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }

  function pack(obj) {
    var text = JSON.stringify(obj);
    var bytes = new TextEncoder().encode(text);
    if (!window.CompressionStream) return Promise.resolve('j' + b64url(bytes));
    var cs = new Blob([bytes]).stream().pipeThrough(new CompressionStream('gzip'));
    return new Response(cs).arrayBuffer().then(function (buf) { return 'g' + b64url(new Uint8Array(buf)); });
  }

  function saveFile(obj) {
    var data = {};
    Object.keys(obj.tables).forEach(function (k) { data[k] = obj.tables[k]; });
    var blob = new Blob([JSON.stringify({ format: 'vinted-profit-ai/backup', version: 2, createdAt: new Date().toISOString(), data: data })], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'cng-vinted_sauvegarde.json';
    a.className = 'btn ghost';
    a.textContent = 'Télécharger ma sauvegarde';
    return a;
  }

  readAll().then(function (tables) {
    var hasData = tables && tables.settings && tables.settings.some(function (s) { return s && s.onboarded; });
    if (!hasData) return go();
    var atts = tables.attachments || [];
    delete tables.attachments;
    var ls = {};
    try { for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (k !== 'cng-transfert-fait') ls[k] = localStorage.getItem(k); } } catch (e) {}
    var payload = { v: 1, from: location.origin + location.pathname, tables: tables, ls: ls, photos: 0, photosTotal: atts.length };
    return pack(payload).then(function (base) {
      // photos et justificatifs ajoutés tant que la taille le permet
      var budget = MAX - base.length;
      var chosen = [];
      return atts.reduce(function (p, a) {
        return p.then(function () {
          if (budget <= 0 || !(a.blob instanceof Blob) || a.blob.size * 1.5 > budget) return;
          return blobToDataURL(a.blob).then(function (d) {
            if (!d || d.length > budget * 1.3) return;
            chosen.push({ id: a.id, mime: a.mime, createdAt: a.createdAt, data: d });
            budget -= d.length * 0.8;
          });
        });
      }, Promise.resolve()).then(function () {
        payload.tables.attachments = chosen;
        payload.photos = chosen.length;
        return pack(payload).then(function (s) {
          if (s.length > MAX) { payload.tables.attachments = []; payload.photos = 0; return pack(payload); }
          return s;
        });
      }).then(function (s) {
        if (s.length > MAX) {
          // trop de données pour un transfert automatique : sauvegarde à importer à la main
          document.getElementById('spin').style.display = 'none';
          msg.innerHTML = 'Tes données sont trop volumineuses pour un transfert automatique. Télécharge ta sauvegarde, puis ouvre la nouvelle adresse et importe-la (Exports → Restaurer une sauvegarde).';
          actions.appendChild(saveFile({ tables: Object.assign({}, tables, { attachments: [] }) }));
          var l = document.createElement('a'); l.href = TARGET; l.className = 'btn primary'; l.textContent = 'Ouvrir la nouvelle adresse'; actions.appendChild(l);
          return;
        }
        try { localStorage.setItem('cng-transfert-fait', '1'); } catch (e) {}
        go('#transfert=' + s);
      });
    });
  }).catch(function () { go(); });
})();
</script>
</body>
</html>
